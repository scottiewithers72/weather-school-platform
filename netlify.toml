# Weather School Platform - Netlify configuration
# Deploy this repo TWICE as two Netlify sites:
#   Site 1: canesweatherschool.com   -> SCHOOL_ID=canes,       publish sites/canes
#   Site 2: earthsphereacademy.com   -> SCHOOL_ID=earthsphere, publish sites/earthsphere
# Both share the same functions/ backend and the same database.
# Publish directory is set PER-SITE in the Netlify UI
# (Site configuration > Build & deploy > Publish directory).

[build]
  functions = "functions"
  # Ship weekly class PDFs as deploy-scoped Netlify Blobs (read by functions/documents.js)
  command = "node scripts/stage-docs.js"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/classroom/*"
  to = "/classroom/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Holiday gifts: hourly check for scheduled gift emails (7 am ET onward)
[functions."gift-delivery"]
  schedule = "0 * * * *"
